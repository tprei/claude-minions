# Local-dev variant of docker-compose.yml. Brings up the engine in a container,
# pointed at the claude-minions repo on the host so agents can edit it.
#
# Usage:
#   mkdir -p .docker-dev/data .docker-dev/repo
#   git clone https://github.com/tprei/claude-minions.git .docker-dev/repo   # OR symlink your working copy
#   docker compose -f docker-compose.dev.yml up --build
#
# First time: authenticate claude inside the container.
#   docker exec -it minions-dev claude /login
#
# Then visit http://localhost:3949/health (the engine), and in the PWA add a
# connection pointing at http://localhost:3949 with no token.

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: minions/engine:dev
    container_name: minions-dev
    restart: unless-stopped
    environment:
      MWF_PORT: 8787
      MWF_DB_PATH: /data/engine.db
      MWF_DATA_DIR: /data/sessions
      MWF_REPO_PATH: /repo
      MWF_WORKSPACE_ROOT: /data/workspace
      MWF_PWA_DIR: /app/packages/web/dist
      HOME: /data/home
      MWF_LOG_LEVEL: info
      MWF_QUALITY_DISABLED: "1"
      MWF_GITHUB_BASE_BRANCH: engine-port
    ports:
      - "3949:8787"
    volumes:
      # Engine state: sqlite + worktrees + claude auth home. All in one host dir.
      - ./.docker-dev/data:/data
      # The repo the agents will work in. Bind-mount your local working copy.
      - ./.docker-dev/repo:/repo
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
