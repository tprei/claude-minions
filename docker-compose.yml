# Single-container deploy: engine handles all automation; no sidecar.
# - landReady, failedCiNoFix, dagStaleReady rules run inside the engine's automation runner.
#
# For the unattended overnight checklist see docs/deploy/supervisor.md.
# Single-container deploy: engine serves /api + the built PWA on /.
#
# First-time setup on the mini PC:
#   git clone https://github.com/tprei/claude-minions.git ~/claude-minions
#   cd ~/claude-minions
#   cp .env.local.example .env.deploy
#   # edit .env.deploy: set MWF_TOKEN, MWF_GITHUB_TOKEN, MWF_GITHUB_REPO_OWNER,
#   # MWF_GITHUB_REPO_NAME. Optional: set CLOUDFLARE_TUNNEL_TOKEN.
#   ln -sf .env.deploy .env   # compose reads ${VAR} from .env at parse time
#   mkdir -p ./secrets ./data/engine ./data/workspace
#   docker run --rm -v ./data:/data -v ./secrets:/secrets alpine chown -R 10001:10001 /data /secrets
#   docker compose up -d --build               # engine only
#   docker compose --profile tunnel up -d      # engine + cloudflared tunnel
#
# Claude credentials live in /data/home/.claude inside the container, which
# bind-mounts to ./data/home/.claude on the host. Run `claude /login` once
# inside the container after first boot:
#   docker exec -it minions claude /login
#
# Update:
#   git pull && docker compose --profile tunnel up -d --build
#
# The web UI is served from the same port; visit http://<host>:8787/ and
# add a connection in the picker pointing back with your MWF_TOKEN.

services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: minions/engine:local
    container_name: minions
    restart: unless-stopped
    env_file:
      - .env.deploy
    environment:
      MWF_HOST: 0.0.0.0
      MWF_PORT: 8787
      MWF_DB_PATH: /data/engine.db
      MWF_DATA_DIR: /data/engine
      MWF_WORKSPACE_ROOT: /data/workspace
      MWF_PWA_DIR: /app/packages/web/dist
      HOME: /data/home
      # Pi provider opt-in. Leave unset to keep the default claude-code provider.
      # Defaults for the Pi-specific knobs live in packages/engine/src/main.ts.
      MWF_PROVIDER: ${MWF_PROVIDER:-}
      MWF_PI_MODEL: ${MWF_PI_MODEL:-}
      MWF_PI_REASONING: ${MWF_PI_REASONING:-}
      MWF_PI_AGENT_DIR: ${MWF_PI_AGENT_DIR:-}
      MWF_PI_SESSION_DIR: ${MWF_PI_SESSION_DIR:-}
      MWF_PI_TOOLS: ${MWF_PI_TOOLS:-}
    ports:
      - "8787:8787"
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      # Pi CLI auth from the host. Writable on purpose: pi rotates the
      # ChatGPT Codex tokens inside auth.json, and a read-only mount would
      # silently break refresh and bounce the worker to logged-out after the
      # first token expiry.
      - ${HOME}/.pi:/data/home/.pi
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://127.0.0.1:8787/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Named Cloudflare tunnel — opt-in via `--profile tunnel`.
  # Set CLOUDFLARE_TUNNEL_TOKEN in .env.deploy after creating the tunnel at
  # https://one.dash.cloudflare.com/ → Networks → Tunnels. Point its public
  # hostname at http://engine:8787 (the docker network alias, not localhost).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      engine:
        condition: service_healthy
